        .toast {

    <script>
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const functions = firebase.functions();

        let currentPage = 'Shop';
        let currentLang = 'en';
        let userStatusListener = null;

        function toggleGlobalUI(show) {
            const display = show ? 'block' : 'none';
            const flexDisplay = show ? 'flex' : 'none';

            const header = document.getElementById('header-container');
            const mobileHeader = document.getElementById('mobile-header-container');
            const mobileMenu = document.getElementById('mobile-menu-container');
            const footer = document.getElementById('footer-container');
            const supportBtn = document.querySelector('.floating-support-btn');

            if (header) header.style.display = display;
            if (mobileHeader) mobileHeader.style.display = display;
            if (mobileMenu) mobileMenu.style.display = display;
            if (footer) footer.style.display = display;
            if (supportBtn) supportBtn.style.display = flexDisplay;
        }

        function checkUserStatus(user) {
            if (userStatusListener) {
                userStatusListener();
                userStatusListener = null;
            }

            if (user) {
                userStatusListener = db.collection("users").doc(user.uid).onSnapshot((doc) => {
                    if (!doc.exists) return;

                    const data = doc.data();
                    const isBanned = data.status === 'banned' || data.isBanned === true || data.banned === true;
                    const isDeleted = data.status === 'deleted' || data.isDeleted === true;
                    const isSuspended = data.status === 'suspended';

                    if (isBanned || isDeleted || isSuspended) {
                        // স্ট্যাটাস মেমোরিতে সেভ রাখা যাতে নেভিগেশন লক করা যায়
                        sessionStorage.setItem('userRestriction', isSuspended ? 'suspended' : 'banned');

                        // গ্লোবাল ইউআই হাইড করা
                        toggleGlobalUI(false);

                        // আপিল পেজে থাকলে ডিস্টার্ব করবে না
                        const urlParams = new URLSearchParams(window.location.search);
                        if (urlParams.get('page') === 'banned_appeal') return;

                        // নির্দিষ্ট পেজে ফরোয়ার্ড করা
                        if (isSuspended) {
                            if (!window.location.href.includes('page=banned')) loadBannedPage();
                        } else {
                            if (!window.location.href.includes('page=deleted')) loadDeletedPage();
                        }
                    } else {
                        // যদি ইউজার আনব্যান হয় তবে মেমোরি ক্লিয়ার করা এবং ইউআই দেখানো
                        if (sessionStorage.getItem('userRestriction')) {
                            sessionStorage.removeItem('userRestriction');
                            toggleGlobalUI(true);
                            window.location.href = window.location.pathname + "?page=shop";
                        }
                    }
                });
            }
        }

        async function handleForcedLogout(enTitle, enMsg, bnTitle, bnMsg, userData = null) {
            const user = auth.currentUser;
            let displayEmail = (userData && userData.email) || (user && user.email) || 'Suspended Account';
            let displayName = (userData && (userData.displayName || userData.name)) || (user && user.displayName) || 'User Account';
            let photoURL = (userData && userData.photoURL) || (user && user.photoURL) || null;
            let uid = (userData && (userData.uid || userData.id)) || (user && user.uid) || null;

            sessionStorage.setItem('lastBannedUser', JSON.stringify({
                displayName: displayName, email: displayEmail, photoURL: photoURL, uid: uid
            }));

            if (userStatusListener) { userStatusListener(); userStatusListener = null; }

            try {
                await auth.signOut(); // Critical permission errors require logout
                loadBannedPage();
            } catch (error) { console.error(error); }
        }

        // Admin Utility: Call Cloud Function to delete a user's Auth account
        async function adminDeleteUserAuth(targetUid) {
            const deleteUserAuth = functions.httpsCallable('deleteUserAuth');
            try {
                const result = await deleteUserAuth({ uid: targetUid });
                console.log(result.data.message);
                return result.data;
            } catch (error) {
                console.error("Admin Action Failed:", error.message);
                throw error;
            }
        }

        function updateAuthUI() {
            const user = auth.currentUser;
            const authButtons = document.querySelector('.auth-buttons');
            const mobileLoginBtn = document.querySelector('.mobile-login-btn');
            const mobileHeader = document.getElementById('mobile-header-container');

            if (user) {
                if (authButtons) {
                    authButtons.innerHTML = `
                        <div class="user-header-profile" onmouseenter="this.classList.add('active')" onmouseleave="this.classList.remove('active')">
                            <div class="user-icon-circle" onclick="loadProfile()">
                                ${user.photoURL ? `<img src="${user.photoURL}" alt="User">` : '<i class="fas fa-user-circle"></i>'}
                            </div>
                            <div class="user-hover-menu">
                                <div class="menu-user-info"><span class="menu-name">${user.displayName || 'User'}</span><span class="menu-email">${user.email}</span></div>
                                <div class="menu-divider"></div>
                                <a href="#" class="menu-item" onclick="loadProfile(); return false;"><i class="fas fa-user-cog"></i> My Profile</a>
                                <a href="#" class="menu-item logout" onclick="handleSignOut(); return false;"><i class="fas fa-sign-out-alt"></i> Logout</a>
                            </div>
                        </div>`;
                }
                if (mobileLoginBtn) mobileLoginBtn.style.display = 'none';
                if (mobileHeader) mobileHeader.classList.add('user-logged-in');
            } else {
                if (authButtons) {
                    authButtons.innerHTML = `
                        <a href="#" class="login-btn" onclick="loadLoginPage(); return false;"><i class="fas fa-user"></i> Login</a>
                        <a href="#" class="register-btn" onclick="loadRegisterPage(); return false;"><i class="fas fa-user-plus"></i> Register</a>`;
                }
                if (mobileLoginBtn) {
                    mobileLoginBtn.style.display = 'flex';
                    mobileLoginBtn.innerHTML = `<i class="fas fa-user"></i> <span>Sign In</span>`;
                    mobileLoginBtn.onclick = (e) => { e.preventDefault(); loadLoginPage(); };
                }
                if (mobileHeader) mobileHeader.classList.remove('user-logged-in');
            }

            const buyNowBtn = document.getElementById('buy-now-btn');
            if (buyNowBtn) {
                if (!user) {
                    buyNowBtn.innerHTML = `<i class="fas fa-sign-in-alt"></i> Login First`;
                    buyNowBtn.classList.add('login-required-btn');
                } else {
                    buyNowBtn.innerHTML = `<i class="fas fa-cart-shopping"></i> Buy Now`;
                    buyNowBtn.classList.remove('login-required-btn');
                }
            }
        }

        auth.onAuthStateChanged((user) => {
            updateAuthUI();
            checkUserStatus(user);
            if (user) {
                // Save user info to localStorage for banned page fallback
                const userInfo = {
                    uid: user.uid,
                    displayName: user.displayName,
                    photoURL: user.photoURL,
                    email: user.email,
                    lastSeen: Date.now()
                };
                localStorage.setItem('b4u_last_user_' + user.email, JSON.stringify(userInfo));
            }
        });

        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.login-required-btn');
            if (btn) { e.preventDefault(); e.stopImmediatePropagation(); loadLoginPage(); }
        }, true);

        function handleSignOut(customMsgEn = null, customMsgBn = null) {
            const modal = document.getElementById('global-logout-modal');
            const modalP = modal.querySelector('.logout-modal-content p');
            const modalTitle = modal.querySelector('.modal-header h3');

            if (modalP) {

        function showGlobalAlert(title, message, timer = null, onComplete = null) {
            document.getElementById('alert-title').innerText = title;

            const timerBox = document.getElementById('alert-timer-box');
            const timerEl = document.getElementById('alert-timer');
            const modal = document.getElementById('global-alert-modal');
            const actions = document.getElementById('alert-actions');
            modal.style.display = 'flex';
            if (timer) {
                timerBox.style.display = 'block'; actions.style.display = 'none';
                let timeLeft = timer; timerEl.innerText = timeLeft;
                const interval = setInterval(() => {
                    timeLeft--; timerEl.innerText = timeLeft;
                    if (timeLeft <= 0) { clearInterval(interval); closeGlobalAlert(); if (onComplete) onComplete(); }
                }, 1000);
            } else { timerBox.style.display = 'none'; actions.style.display = 'flex'; }
        }

        function updateSocialAuthIcons() {
            if (!window.globalAuthSettings) return;

            const updateIcon = (selector, mediaUrl, defaultSrc) => {
                const container = document.querySelector(selector);
                if (!container) return;

                const url = (mediaUrl && mediaUrl.includes('://')) ? mediaUrl : defaultSrc;
                const isVideo = url.toLowerCase().match(/\.(mp4|webm|ogg|mov|avi)/) || url.includes('youtube.com') || url.includes('youtu.be');
                const oldImg = container.querySelector('img');

                if (isVideo) {
                    if (oldImg) oldImg.style.display = 'none';
                    let vBox = container.querySelector('.auth-social-video-box');
                    if (!vBox) {
                        vBox = document.createElement('div');
                        vBox.className = 'auth-social-video-box';
                        vBox.style.width = '24px';
                        vBox.style.height = '24px';
                        vBox.style.borderRadius = '4px';
                        vBox.style.overflow = 'hidden';
                        vBox.style.display = 'flex';
                        vBox.style.alignItems = 'center';
                        vBox.style.justifyContent = 'center';
                        container.insertBefore(vBox, container.firstChild);
                    }

                    if (url.includes('youtube.com') || url.includes('youtu.be')) {
                        let videoId = "";
                        if (url.includes('v=')) videoId = url.split('v=')[1].split('&')[0];
                        else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1].split('?')[0];
                        if (videoId) {
                            vBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}&controls=0" frameborder="0" style="width:100%; height:100%; pointer-events:none; transform: scale(1.5);"></iframe>`;
                        }
                    } else {
                        vBox.innerHTML = `<video src="${url}" autoplay muted loop playsinline style="width:100%; height:100%; object-fit:cover;"></video>`;
                    }
                } else {
                    if (oldImg) {
                        oldImg.src = url;
                        oldImg.style.display = 'block';
                    }
                    const oldV = container.querySelector('.auth-social-video-box');
                    if (oldV) oldV.remove();
                }
            };

            updateIcon('.google-btn', window.globalAuthSettings.googleImage, 'assets/images/auth_images/google.png');
            updateIcon('.facebook-btn', window.globalAuthSettings.facebookImage, 'assets/images/auth_images/facebook.png');
        }

        function startGlobalListeners() {
            // 1. Permanent Shop Listener
            if (!shopListener) {
                shopListener = db.collection("shops").onSnapshot((querySnapshot) => {
                    const shops = [];
                    querySnapshot.forEach(doc => shops.push({ id: doc.id, ...doc.data() }));
                    shops.sort((a, b) => (a.order || 99) - (b.order || 99));
                    window.globalShops = shops;
                    prefetchAllShopData(shops);

                    const currentGrid = document.getElementById('shop-product-grid');
                    if (currentGrid) renderShops(currentGrid, shops);

                    // Reactive menu toggle for Spin
                    const spinData = shops.find(s => s.pageUrl === 'spin' || s.id === 'spin');
                    const spinNav = document.getElementById('nav-item-spin');
                    const spinMobileNav = document.getElementById('mobile-nav-item-spin');
                    if (spinData && spinData.active === false) {
                        if (spinNav) spinNav.style.display = 'none';
                        if (spinMobileNav) spinMobileNav.style.display = 'none';
                    } else {
                        if (spinNav) spinNav.style.display = 'inline-flex';
                        if (spinMobileNav) spinMobileNav.style.display = 'flex';
                    }
                });
            }

            // 2. Permanent Slider Listener
            if (!sliderListener) {
                sliderListener = db.collection("web_settings").doc("slider").onSnapshot((doc) => {
                    if (!doc.exists) return;
                    window.globalSliderData = doc.data();
                    forceSliderUpdate();
                });
            }

            // 3. Permanent Notice Listener
            if (!noticeListener) {
                noticeListener = db.collection("web_settings").doc("notice").onSnapshot((doc) => {
                    if (!doc.exists) return;
                    window.globalNoticeData = doc.data();
                    forceNoticeUpdate();
                });
            }

            // 4. Permanent Payment Methods Listener
            if (!paymentMethodsListener) {
                paymentMethodsListener = db.collection("payment_methods").onSnapshot((querySnapshot) => {
                    const methods = {};
                    querySnapshot.forEach(doc => {
                        methods[doc.id] = doc.data();
                    });
                    window.globalPaymentMethods = methods;
                    applyPaymentMethodsVisibility();
                });
            }

            // 5. Permanent Auth Settings Listener
            if (!authSettingsListener) {
                authSettingsListener = db.collection("web_settings").doc("auth").onSnapshot((doc) => {
                    if (doc.exists) {
                        window.globalAuthSettings = doc.data();

                        // Reactive Update for Login/Register Pages
                        if (window.location.href.includes('page=login') || window.location.href.includes('page=register')) {

            // 6. Permanent AI Settings Listener

                    if (doc.exists) {
                        window.globalAiSettings = doc.data();

                        window.globalGeneralSettings = doc.data();

            if (!policiesListener) {

                    if (doc.exists) {
                        window.globalPolicies = doc.data();
                        updatePolicyPages();
                    }
                });
            }

            // 9. Permanent Status Listener
            if (!statusListener) {
                statusListener = db.collection("web_settings").doc("status").onSnapshot((doc) => {
                    if (doc.exists) {
                        window.globalWebStatus = doc.data();
                        applyWebStatus();

        function applyGeneralSettings() {

            if (gs.siteName) {
                document.title = gs.siteName + " - Topup Center";
                document.querySelectorAll('.site-name, .mobile-site-name').forEach(el => el.innerText = gs.siteName);

                const isVideo = gs.logoUrl.toLowerCase().match(/\.(mp4|webm|ogg|mov|avi)/) || gs.logoUrl.includes('youtube.com') || gs.logoUrl.includes('youtu.be');

                // Update Favicon & Touch Icons
                if (!isVideo) {
                    const iconTypes = ['link[rel="icon"]', 'link[rel="shortcut icon"]', 'link[rel="apple-touch-icon"]'];
                    iconTypes.forEach(selector => {
                        let el = document.querySelector(selector);
                        if (!el) {
                            el = document.createElement('link');
                            el.rel = selector.includes('apple') ? 'apple-touch-icon' : 'icon';
                            document.head.appendChild(el);

                    });
                }

                const updateLogoEl = (imgSelector) => {
                    const img = document.querySelector(imgSelector);
                    if (!img) return;

                    if (isVideo) {
                        img.style.display = 'none';
                        let vBox = img.parentElement.querySelector('.dynamic-logo-video-box');

                            vBox.style.height = '40px'; // Safe default

                        if (gs.logoUrl.includes('youtube.com') || gs.logoUrl.includes('youtu.be')) {
                             let vId = gs.logoUrl.includes('v=') ? gs.logoUrl.split('v=')[1].split('&')[0] : gs.logoUrl.split('youtu.be/')[1].split('?')[0];
                             vBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${vId}?autoplay=1&mute=1&loop=1&playlist=${vId}&controls=0" frameborder="0" style="height:100%; width:100px; pointer-events:none; transform: scale(1.5);"></iframe>`;
                        } else {
                             vBox.innerHTML = `<video src="${gs.logoUrl}" autoplay muted loop playsinline style="height:100%; width:auto; object-fit:contain;"></video>`;
                        }
                    } else {
                        img.src = gs.logoUrl;
                        img.style.display = 'block';
                        const oldV = img.parentElement.querySelector('.dynamic-logo-video-box');
                        if (oldV) oldV.remove();
                    }
                };

                // Apply to ALL logo classes across the site
                ['.logo-img', '.mobile-logo-img', '.footer-logo-img', '.login-logo', '.register-logo'].forEach(cls => updateLogoEl(cls));
            }

            // 3. Update Website Name/Title everywhere
            if (gs.siteName) {
                document.title = gs.siteName + " - Topup Center";
                document.querySelectorAll('.site-name, .mobile-site-name, .footer-logo-text').forEach(el => el.innerText = gs.siteName);

            if (gs.whatsapp) {

                document.querySelectorAll('.support-whatsapp, .footer-section a[href*="wa.me"]').forEach(el => el.href = waLink);

            if (gs.telegram) {
                document.querySelectorAll('.support-telegram, .footer-section a[href*="t.me"]').forEach(el => el.href = gs.telegram);

            if (gs.fbPage) {
                document.querySelectorAll('.footer-section a[href*="facebook.com"]').forEach(el => el.href = gs.fbPage);
            }
            if (gs.youtube) {
                document.querySelectorAll('.footer-section a[href*="youtube.com"]').forEach(el => el.href = gs.youtube);

            if (gs.tiktok) {

                    function parseStatusText(text) {
                        if (!text) return "";
                        let safe = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

                        // Structure & Headings
                        safe = safe.replace(/^# (.*$)/gim, '<h3>$1</h3>');
                        safe = safe.replace(/^## (.*$)/gim, '<h4>$1</h4>');
                        safe = safe.replace(/\[hr\]/g, '<div class="divider-line"></div>');
                        safe = safe.replace(/\[br\]/g, '<br>');

                        // Basic Formatting
                        safe = safe.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                        safe = safe.replace(/_(.*?)_/g, '<em>$1</em>');
                        safe = safe.replace(/\[u\](.*?)\[\/u\]/g, '<u>$1</u>');
                        safe = safe.replace(/\[s\](.*?)\[\/s\]/g, '<strike>$1</strike>');

                        // Advanced Text Effects
                        safe = safe.replace(/\[gradient\](.*?)\[\/gradient\]/g, '<span class="gradient-text">$1</span>');
                        safe = safe.replace(/\[rainbow\](.*?)\[\/rainbow\]/g, '<span class="rainbow-text">$1</span>');
                        safe = safe.replace(/\[shimmer\](.*?)\[\/shimmer\]/g, '<span class="shimmer-text">$1</span>');
                        safe = safe.replace(/\[pulse\](.*?)\[\/pulse\]/g, '<span class="pulse-text">$1</span>');
                        safe = safe.replace(/\[wave\](.*?)\[\/wave\]/g, '<span class="wave-text">$1</span>');

                        // Colors & Glows
                        safe = safe.replace(/\[glow=(.*?)\](.*?)\[\/glow\]/g, '<span class="glow-text" style="color:$1">$2</span>');
                        safe = safe.replace(/\[neon=blue\](.*?)\[\/neon\]/g, '<span class="neon-blue">$1</span>');
                        safe = safe.replace(/\[neon=red\](.*?)\[\/neon\]/g, '<span class="neon-red">$1</span>');
                        safe = safe.replace(/\[color=(.*?)\](.*?)\[\/color\]/g, '<span style="color:$1">$2</span>');
                        safe = safe.replace(/\[bg=(.*?)\](.*?)\[\/bg\]/g, '<span style="background:$1; padding:2px 6px; border-radius:4px;">$2</span>');

                        // Sizing & Alignment
                        safe = safe.replace(/\[xs\](.*?)\[\/xs\]/g, '<span class="txt-xs">$1</span>');
                        safe = safe.replace(/\[sm\](.*?)\[\/sm\]/g, '<span class="txt-sm">$1</span>');
                        safe = safe.replace(/\[lg\](.*?)\[\/lg\]/g, '<span class="txt-lg">$1</span>');
                        safe = safe.replace(/\[xl\](.*?)\[\/xl\]/g, '<span class="txt-xl">$1</span>');
                        safe = safe.replace(/\[xxl\](.*?)\[\/xxl\]/g, '<span class="txt-xxl">$1</span>');
                        safe = safe.replace(/\[center\](.*?)\[\/center\]/g, '<span class="t-center">$1</span>');
                        safe = safe.replace(/\[left\](.*?)\[\/left\]/g, '<span class="t-left">$1</span>');
                        safe = safe.replace(/\[right\](.*?)\[\/right\]/g, '<span class="t-right">$1</span>');

                        // Components
                        safe = safe.replace(/\[box\](.*?)\[\/box\]/g, '<div class="glass-box">$1</div>');
                        safe = safe.replace(/\[info\](.*?)\[\/info\]/g, '<div class="info-alert">$1</div>');
                        safe = safe.replace(/\[warn\](.*?)\[\/warn\]/g, '<div class="warn-alert">$1</div>');
                        safe = safe.replace(/\[error\](.*?)\[\/error\]/g, '<div class="error-alert">$1</div>');
                        safe = safe.replace(/\[badge=(.*?)\](.*?)\[\/badge\]/g, '<span class="status-badge" style="background:$122; color:$1; border-color:$144">$2</span>');
                        safe = safe.replace(/\[btn=(.*?)\](.*?)\[\/btn\]/g, '<a href="$1" target="_blank" class="custom-btn">$2</a>');
                        safe = safe.replace(/` (.*?)`/g, '<code>$1</code>');

                        // Lists
                        safe = safe.replace(/^\* (.*$)/gim, '<li>$1</li>');
                        safe = safe.replace(/(<li>.*<\/li>)/gms, '<ul>$1</ul>');

                        return safe.replace(/\n/g, '<br>');
                    }

                    if (reason) reason.innerHTML = parseStatusText(reasonText);

                    // UI elements
                    const dot = document.getElementById('pulse-dot');
                    const iconBox = document.getElementById('icon-box');
                    const mainIcon = document.getElementById('main-icon');

        let sliderInterval = null;

        function getMediaHtml(item, index) {
            if (!item) return "";
            const url = (typeof item === 'object' && item.url) ? item.url : item;
            const videoLink = (typeof item === 'object' && item.videoLink) ? item.videoLink : null;
            if (!url) return "";

            const lowUrl = url.toString().toLowerCase();
            let mediaHtml = "";

            if (lowUrl.includes('youtube.com') || lowUrl.includes('youtu.be')) {
                let videoId = "";
                if (url.includes('v=')) videoId = url.split('v=')[1].split('&')[0];
                else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1].split('?')[0];
                else if (url.includes('embed/')) videoId = url.split('embed/')[1].split('?')[0];
                if (videoId) {
                    mediaHtml = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}&controls=0&modestbranding=1" frameborder="0" allow="autoplay; encrypted-media" style="width:100%; height:100%; border:none; pointer-events:none;"></iframe>`;
                }
            } else if (lowUrl.includes('pinterest.com') || lowUrl.includes('pin.it')) {
                let pinId = "";
                if (url.includes('/pin/')) pinId = url.split('/pin/')[1].split('/')[0];
                if (pinId) {
                    mediaHtml = `<iframe src="https://assets.pinterest.com/ext/embed.html?id=${pinId}" height="100%" width="100%" frameborder="0" scrolling="no" style="width:100%; height:100%; border:none; overflow:hidden;"></iframe>`;
                } else {
                    mediaHtml = `<iframe src="${url}" style="width:100%; height:100%; border:none;"></iframe>`;
                }
            } else if (lowUrl.match(/\.(mp4|webm|ogg|mov|avi)/)) {
                mediaHtml = `<video src="${url}" autoplay muted loop playsinline style="width:100%; height:100%; object-fit:cover;"></video>`;
            } else if (lowUrl.includes('tiktok.com')) {
                mediaHtml = `<iframe src="${url}" style="width:100%; height:100%; border:none;"></iframe>`;
            } else {
                mediaHtml = `<img src="${url}" alt="Slider ${index + 1}" style="width:100%; height:100%; object-fit:cover;" onerror="this.style.display='none'; this.parentElement.style.background='#111';">`;
            }

            if (videoLink) {
                mediaHtml += `<a href="${videoLink}" target="_blank" class="slider-action-btn">View Details <i class="fas fa-arrow-right"></i></a>`;
            }

            return `<div class="slide" style="position: relative;">${mediaHtml}</div>`;
        }

        function initSliderLogic(slidesCount, duration) {
            const track = document.getElementById('slider-track');
            const dots = document.querySelectorAll('.dot');
            if (!track || dots.length === 0) return;
            if (sliderInterval) clearInterval(sliderInterval);
            let currentSlide = 0;
            function updateSlider(withTransition = true) {
                track.style.transition = withTransition ? 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)' : 'none';
                const step = 100 / (slidesCount + 1);
                track.style.transform = `translateX(-${currentSlide * step}%)`;
                dots.forEach((dot, index) => dot.classList.toggle('active', index === (currentSlide % slidesCount)));
            }
            function nextSlide() {
                currentSlide++;
                updateSlider(true);
                if (currentSlide === slidesCount) {
                    setTimeout(() => {
                        currentSlide = 0;
                        updateSlider(false);
                    }, 600);
                }
            }
            sliderInterval = setInterval(nextSlide, duration);
            dots.forEach((dot, index) => {
                dot.onclick = () => {
                    clearInterval(sliderInterval);
                    currentSlide = index;
                    updateSlider(true);
                    sliderInterval = setInterval(nextSlide, duration);
                };
            });
        }

        function forceSliderUpdate() {
            const sliderBox = document.querySelector('.shop-slider-container');
            const track = document.getElementById('slider-track');
            const dots = document.getElementById('slider-dots');
            if (sliderBox && track && dots && window.globalSliderData) {
                applySliderToUI(sliderBox, track, dots, window.globalSliderData);
            }
        }

        function applySliderToUI(sliderBox, track, dotsContainer, data) {
            if (!data || !data.images) {
                sliderBox.style.display = 'none';
                return;
            }

            const mediaItems = data.images;
            const duration = data.duration || 5000;

            const validMedia = mediaItems.filter(item => {
                const url = (typeof item === 'object' && item.url) ? item.url : item;
                return url && (url.toString().startsWith('http') || url.toString().includes('://'));
            });

            if (validMedia.length > 0) {
                sliderBox.style.display = 'block';
                let trackHtml = "";
                let dotsHtml = "";

                if (validMedia.length === 1) {
                    track.style.width = "100%";
                    track.innerHTML = getMediaHtml(validMedia[0], 0);
                    const singleSlide = track.querySelector('.slide');
                    if (singleSlide) singleSlide.style.width = "100%";
                    dotsContainer.innerHTML = "";
                    if (sliderInterval) clearInterval(sliderInterval);
                    return;
                }

                const totalWithClone = validMedia.length + 1;
                track.style.width = (totalWithClone * 100) + "%";

                validMedia.forEach((item, index) => {
                    trackHtml += getMediaHtml(item, index);
                    dotsHtml += `<span class="dot ${index === 0 ? 'active' : ''}"></span>`;
                });

                trackHtml += getMediaHtml(validMedia[0], 0);
                track.innerHTML = trackHtml;
                dotsContainer.innerHTML = dotsHtml;

                const slides = track.querySelectorAll('.slide');
                const slideWidthPercent = (100 / totalWithClone).toFixed(5);
                slides.forEach(s => s.style.width = slideWidthPercent + "%");

                initSliderLogic(validMedia.length, duration);
            } else {
                sliderBox.style.display = 'none';
            }
        }

        let productListener = null;
        const templateCache = {};
        const globalShopData = {}; // Instant Data Store

        // --- Extreme Performance: Prefetch Everything ---
        async function prefetchAllShopData(shops) {
            console.log("🚀 Pre-fetching all shop data for instant access...");
            shops.forEach(async (shop) => {
                const shopId = shop.id;

                // 1. Prefetch HTML Template
                if (shop.pageUrl && shop.pageUrl !== 'whatsapp' && !templateCache[shop.pageUrl]) {
                    fetch(shop.pageUrl).then(r => r.text()).then(html => templateCache[shop.pageUrl] = html);
                }

                // 2. Persistent Background Listeners for all shops
                db.collection("shops").doc(shopId).collection("items").onSnapshot(snap => {
                    const items = [];
                    snap.forEach(d => items.push({id: d.id, ...d.data()}));
                    globalShopData[shopId] = items;

                    // If user is CURRENTLY viewing this shop, update UI instantly
                    if (window.currentProductPage && window.currentProductPage.shopId === shopId) {
                        const grid = document.getElementById('recharge-grid');
                        if (grid) renderItems(grid, items, window.currentProductPage.url);
                    }
                });
            });
        }

        async function loadProductPage(url, pushState = true, shopId = null) {
            if (sessionStorage.getItem('userRestriction')) { handleRestrictedAccess(); return; }

            // Check if shop is active before loading
            if (shopId && window.globalShops) {
                const shop = window.globalShops.find(s => s.id === shopId);
                if (shop && shop.active === false) {
                    showToast("This shop is temporarily closed.", "এই শপটি সাময়িকভাবে বন্ধ রয়েছে।", "fa-lock");
                    return;
                }
            }

            try {
                window.currentProductPage = { url: url, shopId: shopId };
                updateActiveStates('Shop');

                // --- 1. Instant HTML from Cache ---
                let html = templateCache[url];
                if (!html) {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error("Page not found");
                    html = await res.text();
                    templateCache[url] = html;
                }

                document.getElementById('main-content').innerHTML = html;
                window.scrollTo(0, 0);
                updateAuthUI();
                applyPaymentMethodsVisibility();

                // --- NEW: Update Shop Header Image/Title ---
                const shop = window.globalShops ? window.globalShops.find(s => s.id === shopId) : null;
                if (shop) {
                    const headerTitle = document.querySelector('.product-header-title');
                    const headerImg = document.querySelector('.product-header-img');
                    if (headerTitle) headerTitle.innerText = shop.name;
                    if (headerImg) {
                        const mediaUrl = shop.shopIcon || shop.image || shop.imageUrl || '';
                        if (mediaUrl && mediaUrl.includes('://')) {
                            headerImg.src = mediaUrl;
                            headerImg.style.display = 'block';
                            // Hide fallback icon if any
                            const fallbackIcon = document.querySelector('.generic-shop-icon');
                            if (fallbackIcon) fallbackIcon.style.display = 'none';
                        } else {
                            headerImg.style.display = 'none';
                            const fallbackIcon = document.querySelector('.generic-shop-icon');
                            if (fallbackIcon) fallbackIcon.style.display = 'block';
                        }
                    }
                }

                const grid = document.getElementById('recharge-grid');
                if (grid && shopId) {
                    // --- 2. Instant Data from Memory (Zero Delay) ---
                    if (globalShopData[shopId]) {
                        renderItems(grid, globalShopData[shopId], url);
                    } else {
                        // If not pre-fetched yet, show skeleton
                        renderSkeleton(grid);
                    }
                }

                let scriptPath = '';
                if (url.includes('uid_topup_bd')) scriptPath = 'pages/shop/UID Topup BD/js/uid_topup_bd.js';
                else if (url.includes('weekly_monthly')) scriptPath = 'pages/shop/Weekly Monthly/js/weekly_monthly.js';
                else if (url.includes('weekly_lite')) scriptPath = 'pages/shop/Weekly Lite/js/weekly_lite.js';
                else if (url.includes('level_up_pass')) scriptPath = 'pages/shop/Level Up Pass/js/level_up_pass.js';
                else if (url.includes('uid_evo_access')) scriptPath = 'pages/shop/UID Evo Access/js/uid_evo_access.js';
                else if (url.includes('generic_product')) scriptPath = 'pages/shop/js/generic_product.js';

                if (scriptPath) {
                    safeLoadScript(scriptPath, () => {
                        if (url.includes('generic_product') && typeof initGenericProduct === 'function') initGenericProduct();
                        else callInitFunction(url);
                    });
                }

                if (pushState) {
                    let page = 'product';
                    if (url.includes('uid_topup_bd')) page = 'uidtopup';
                    else if (url.includes('weekly_monthly')) page = 'weeklymonthly';
                    else if (url.includes('weekly_lite')) page = 'weeklylite';
                    else if (url.includes('level_up_pass')) page = 'leveluppass';

        function renderSkeleton(grid) {
            grid.innerHTML = Array(6).fill(0).map(() => `
                <div class="recharge-item skeleton" style="height: 60px; pointer-events: none; border: none; margin-bottom: 10px;"></div>
            `).join('');
        }

        function renderItems(grid, items, url) {
            items.sort((a, b) => (a.price || 0) - (b.price || 0));
            grid.innerHTML = '';
            if (items.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: rgba(255,255,255,0.5); padding: 20px;">No items available yet.</p>';
                return;
            }

            items.forEach((data) => {
                const isStockOut = data.active === false;
                const item = document.createElement('div');
                item.className = `recharge-item ${isStockOut ? 'stock-out' : ''}`;

                let priceHtml = `<span class="price-amount">${data.price || 0} ৳</span>`;
                if (data.originalPrice && data.originalPrice != data.price) {
                    const isDiscount = data.originalPrice > data.price;
                    const priceClass = isDiscount ? 'discounted' : 'increased';
                    const arrowIcon = isDiscount ? '<i class="fas fa-arrow-down price-indicator down"></i>' : '<i class="fas fa-arrow-up price-indicator up"></i>';
                    priceHtml = `
                        <div class="price-wrapper">
                            <span class="original-price">${data.originalPrice} ৳</span>
                            <span class="price-amount ${priceClass}">${data.price || 0} ৳ ${arrowIcon}</span>
                        </div>`;
                }

                item.innerHTML = `
                    <div class="recharge-details">
                        <span class="diamond-amount">${data.name || 'Unknown Item'}</span>
                        ${priceHtml}
                    </div>`;
                grid.appendChild(item);
            });
            callInitFunction(url);
        }

        function callInitFunction(url) {
            if (url.includes('uid_topup_bd') && typeof initUIDTopup === 'function') initUIDTopup();
            else if (url.includes('weekly_monthly') && typeof initWeeklyMonthly === 'function') initWeeklyMonthly();
            else if (url.includes('weekly_lite') && typeof initWeeklyLite === 'function') initWeeklyLite();
            else if (url.includes('level_up_pass') && typeof initLevelUpPass === 'function') initLevelUpPass();
            else if (url.includes('uid_evo_access') && typeof initUIDEvoAccess === 'function') initUIDEvoAccess();
        }

        async function loadPaymentPage(url, amount, pushState = true) {
            if (sessionStorage.getItem('userRestriction')) { handleRestrictedAccess(); return; }
            try {
                // Inject redirect info
                const pending = sessionStorage.getItem('pending_order');
                if (pending && window.currentProductPage) {
                    const data = JSON.parse(pending);
                    data.redirectInfo = window.currentProductPage;
                    sessionStorage.setItem('pending_order', JSON.stringify(data));
                }

                const res = await fetch(url); const html = await res.text();
                document.getElementById('main-content').innerHTML = html; window.scrollTo(0, 0);

                const methodId = url.split('_').pop().split('.')[0];
                const paymentData = window.globalPaymentMethods ? window.globalPaymentMethods[methodId] : null;

                setTimeout(() => {
                    const el = document.getElementById('payment-final-amount'), el2 = document.getElementById('payment-final-amount-en'), el3 = document.getElementById('logo-amount-val');
                    if (el) el.innerText = amount; if (el2) el2.innerText = amount; if (el3) el3.innerText = amount + ' ৳';

                    // Update verification logo if dynamic link exists (Image or Video)
                    if (paymentData && paymentData.verifyImage && paymentData.verifyImage.includes('://')) {
                        const mediaUrl = paymentData.verifyImage;
                        const isVideo = mediaUrl.toLowerCase().match(/\.(mp4|webm|ogg|mov|avi)/) || mediaUrl.includes('youtube.com') || mediaUrl.includes('youtu.be');
                        const logoImg = document.querySelector('.payment-logo-img');

                        if (isVideo) {
                            if (logoImg) logoImg.style.display = 'none';
                            let vContainer = document.querySelector('.payment-video-logo-box');
                            if (!vContainer) {
                                vContainer = document.createElement('div');
                                vContainer.className = 'payment-video-logo-box';
                                vContainer.style.height = '80px';
                                vContainer.style.width = '120px'; // Wider for better video view
                                vContainer.style.borderRadius = '12px';
                                vContainer.style.overflow = 'hidden';
                                vContainer.style.display = 'flex';
                                vContainer.style.alignItems = 'center';
                                vContainer.style.justifyContent = 'center';
                                const logoBox = document.querySelector('.payment-logo-box');
                                if (logoBox) logoBox.insertBefore(vContainer, logoBox.firstChild);
                            }

                            if (mediaUrl.includes('youtube.com') || mediaUrl.includes('youtu.be')) {
                                let videoId = "";
                                if (mediaUrl.includes('v=')) videoId = mediaUrl.split('v=')[1].split('&')[0];
                                else if (mediaUrl.includes('youtu.be/')) videoId = mediaUrl.split('youtu.be/')[1].split('?')[0];
                                if (videoId) {
                                    vContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}&controls=0" frameborder="0" style="width:100%; height:100%; pointer-events:none;"></iframe>`;
                                }
                            } else {
                                vContainer.innerHTML = `<video src="${mediaUrl}" autoplay muted loop playsinline style="width:100%; height:100%; object-fit:cover;"></video>`;
                            }
                        } else {
                            if (logoImg) {
                                logoImg.src = mediaUrl;
                                logoImg.style.display = 'block';
                            }
                            const oldV = document.querySelector('.payment-video-logo-box');
                            if (oldV) oldV.remove();
                        }
                    }
                }, 150);
                if (pushState) { const method = url.split('_').pop().split('.')[0]; history.pushState({ page: 'payment', url: url, amount: amount }, 'Payment', `?page=payment&method=${method}&amount=${amount}`); }
                safeLoadScript('pages/payment/js/payment.js', () => { if(typeof initPaymentPage === 'function') initPaymentPage(); });
            } catch (error) { console.error("Error loading payment:", error); }
        }

        window.copyNumber = function(num) {
            const el = document.createElement("textarea"); el.value = num; document.body.appendChild(el); el.select();
            try { document.execCommand('copy'); showToast("Number copied: " + num, "নম্বর কপি হয়েছে: " + num, "fa-copy"); } catch (err) {}
            document.body.removeChild(el);
        };

        function switchLang(lang) {
            const en = document.getElementById('rules-en'), bn = document.getElementById('rules-bn'), btns = document.querySelectorAll('.lang-btn');
            if (!en || !bn) return;
            if (lang === 'en') { en.style.display = 'flex'; bn.style.display = 'none'; btns[0].classList.add('active'); btns[1].classList.remove('active'); }
            else { en.style.display = 'none'; bn.style.display = 'flex'; btns[0].classList.remove('active'); btns[1].classList.add('active'); }
        }

        function handleRestrictedAccess() {
            const restriction = sessionStorage.getItem('userRestriction');
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('page') === 'banned_appeal') return;

            if (restriction === 'suspended') loadBannedPage();
            else loadDeletedPage();
        }

        window.onload = async () => {
            const restriction = sessionStorage.getItem('userRestriction');
            const urlParams = new URLSearchParams(window.location.search);
            const page = urlParams.get('page');
            const shopId = urlParams.get('shopId');

            // ১. যদি ইউজার ব্যান থাকে, তবে হেডার-ফুটার কিছুই লোড হবে না
            if (restriction) {
                toggleGlobalUI(false);
                handleRestrictedAccess();

                // যদি রিলোড দিয়ে আপিল পেজে আসার চেষ্টা করে, তাকে আবার মেইন ব্যান পেজে ফেরত পাঠানো হবে
                if (page === 'banned_appeal') {
                    setTimeout(() => handleRestrictedAccess(), 100);
                }
                return;
            }

            loadHeader(); loadMobileHeader(); loadMobileMenu(); loadFooter();

            // Start Global Listeners for instant home data
            startGlobalListeners();

            if (page === 'uidtopup') loadProductPage('pages/shop/UID Topup BD/html/uid_topup_bd.html', false, shopId);
            else if (page === 'spin') { const pkg = urlParams.get('package'); if (pkg === 'spins') loadSpinPackage('pages/spin/spins/html/spins.html', false); else loadSpin(false); }
            else if (page === 'my-order') loadMyOrder(false);
            else if (page === 'profile') {
                const sub = urlParams.get('sub');
                if (sub === 'topup_history') loadProfileSubPage('pages/profile/topup_history/html/topup_history.html', false);
                else if (sub === 'add_funds') loadProfileSubPage('pages/profile/add_funds/html/add_funds.html', false);
                else if (sub === 'inventory_withdraw') loadProfileSubPage('pages/profile/inventory_withdraw/html/inventory_withdraw.html', false);
                else if (sub === 'account') loadProfileSubPage('pages/profile/account/html/account.html', false);
                else loadProfile(false);
            }
            else if (page === 'weeklymonthly') loadProductPage('pages/shop/Weekly Monthly/html/weekly_monthly.html', false, shopId);
            else if (page === 'weeklylite') loadProductPage('pages/shop/Weekly Lite/html/weekly_lite.html', false, shopId);
            else if (page === 'leveluppass') loadProductPage('pages/shop/Level Up Pass/html/level_up_pass.html', false, shopId);
            else if (page === 'uidevoaccess') loadProductPage('pages/shop/UID Evo Access/html/uid_evo_access.html', false, shopId);
            else if (page === 'product' || shopId) {
                // Handle dynamic shops or reload on generic product page
                if (shopId) {
                    try {
                        const shopDoc = await db.collection("shops").doc(shopId).get();
                        if (shopDoc.exists) {
                            const data = shopDoc.data();
                            if (data.pageUrl) loadProductPage(data.pageUrl, false, shopId);
                            else loadShop(false);
                        } else {
                            loadShop(false);
                        }
                    } catch (e) {
                        console.error("Reload Error:", e);
                        loadShop(false);
                    }
                } else {
                    loadShop(false);
                }
            }
            else if (page === 'offers') loadOffers(false);
            else if (page === 'login') loadLoginPage(false);
            else if (page === 'register') loadRegisterPage(false);
            else if (page === 'privacy-policy') loadPrivacyPolicy(false);
            else if (page === 'terms-conditions') loadTermsConditions(false);
            else if (page === 'refund-policy') loadRefundPolicy(false);
            else if (page === 'banned') loadBannedPage(false);
            else if (page === 'deleted') loadDeletedPage(false);
            else if (page === 'payment') { const m = urlParams.get('method'), a = urlParams.get('amount'); if (m && a) loadPaymentPage(`pages/payment/html/payment_${m}.html`, a, false); else loadShop(false); }
            else loadShop(false);
        };

        window.addEventListener('popstate', (event) => {
            const restriction = sessionStorage.getItem('userRestriction');
            if (restriction) {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('page') === 'banned_appeal') {
                    loadBannedAppeal(false);
                    return;
                }

                if (restriction === 'suspended') {
                    loadBannedPage(false);
                    history.pushState({ page: 'banned' }, 'Account Suspended', '?page=banned');
                } else {
                    loadDeletedPage(false);
                    history.pushState({ page: 'deleted' }, 'Account Banned', '?page=deleted');
                }
                return;
            }

            if (event.state) {
                if (event.state.page === 'shop') loadShop(false);
                else if (event.state.page === 'spin') loadSpin(false);
                else if (event.state.page === 'my_order') loadMyOrder(false);
                else if (event.state.page === 'offers') loadOffers(false);
                else if (event.state.page === 'profile') loadProfile(false);
                else if (event.state.page === 'profile_sub') loadProfileSubPage(event.state.url, false);
                else if (event.state.page === 'spin_package') loadSpinPackage(event.state.url, false);
                else if (event.state.page === 'product') loadProductPage(event.state.url, false, event.state.shopId);
                else if (event.state.page === 'login') loadLoginPage(false);
                else if (event.state.page === 'register') loadRegisterPage(false);
                else if (event.state.page === 'privacy_policy') loadPrivacyPolicy(false);
                else if (event.state.page === 'terms_conditions') loadTermsConditions(false);
                else if (event.state.page === 'refund_policy') loadRefundPolicy(false);
                else if (event.state.page === 'banned') loadBannedPage(false);
                else if (event.state.page === 'deleted') loadDeletedPage(false);
                else if (event.state.page === 'payment') loadPaymentPage(event.state.url, event.state.amount, false);
            } else loadShop(false);
        });
    </script>
</body>
</html>
